name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained app
        run: dotnet publish YubikeyLocker.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Prepare output folder
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\YubiKeyLocker.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: YubiKeyLocker-Setup-win-x64
          path: artifacts/*.exe

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
